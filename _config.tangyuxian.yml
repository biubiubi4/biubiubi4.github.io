favicon:
  href: /images/head/head.svg
  type: image/svg+xml

function:
  globalToc: true
  wordCount: false
  copyCode: true

imageCDN:
  enable: false
  origin: /../../images/
  to: https://cdn.jsdelivr.net/gh/nexmoe/nexmoe.github.io@latest/images/

customStyles: []

iconlib: //at.alicdn.com/t/font_2421060_8z08qcz5sq3.css

menu:
  首页:
    - /
    - icon-meishi
  文章归档:
    - /archives.html
    - icon-hanbao1
  关于我:
    - /about.html
    - icon-jiubei1
  友情链接:
    - /friend.html
    - icon-cola
  碎碎念:
    - /memos.html
    - icon-tangguo

memos:
  host: https://memos.tangyuxian.com
  pageSize: 10
  filter: "#moments"
  enableFancybox: true

widgets:
  - name: switch_theme
    enable: true
  - name: search
    enable: true
    options:
      search:
        type: local
        url: https://www.bing.com/search?q=site:lyccyl.cn
        id: <swiftype-id>
  - name: social
    enable: true
    options:
      social:
        QQ:
          - http://wpa.qq.com/msgrd?v=3&uin=1419340958&site=qq&menu=yes
          - icon-QQ
          - rgb(64, 196, 255)
          - rgba(64, 196, 255, .1)
        mail:
          - mailto:1419340958@qq.com
          - icon-mail-fill
          - rgb(249, 8, 8)
          - rgba(249, 8, 8, .1)
        GitHub:
          - https://github.com/biubiubi4/
          - icon-github
          - rgb(25, 23, 23)
          - rgba(25, 23, 23, .15)
  - name: category
    enable: true
  - name: tagcloud
    enable: true
    options:
      maxTagcloud: 17
  - name: hitokoto
    enable: false
    options:
      widgetHitokoto:
        loading_placeholder: '获取中...'
        loading_error_placeholder: '获取失败...'
        category:
  - name: archive
    enable: true
    options:
      widgetAchive:
        archive_type: 'year'
        show_count: true
  - name: recent_posts
    enable: false
  - name: link
    enable: false
    options:
      widgetLink:
        - title: 糖糖的闺中小秘密
          img: https://cdn.tangyuxian.com/PicGoImages/202304272004917.jpg
          link: https://memos.tangyuxian.com/

pendants:
  - name: clock
    enable: false
  - name: qweather
    enable: false

copyTip: |
  著作权归作者所有。
  商业转载请联系作者获得授权，非商业转载请注明出处。
  来源：%url

chatbot:
  enable: true
  options:
    title: LYC 的 AI 分身 (BETA)
    chat: https://www.tangyuxian.com/weifu.html
    style: "width: 100%; height: 100%; overflow: hidden;"

